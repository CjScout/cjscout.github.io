<div class="blog-header">
    <h2>Blog</h2>
</div>
<div class="flex justify-content-center">
    <div class="blog-list">
        @if (argState.isUnlocked(3)) {
            <a routerLink="/private-notes" class="blog-list-item door-post">
                <h3>◆ [untitled draft]</h3>
                <p class="post-date">timestamp corrupted</p>
                <p class="post-summary">A door just unlocked somewhere on this site. This one was never meant to go live — go through it.</p>
            </a>
        }
        <a *ngFor="let post of posts" class="blog-list-item" [routerLink]="['/blog', post.slug]">
            <h3>{{ post.title }}</h3>
            <p class="post-date">{{ post.date }}</p>
            <p class="post-summary">{{ post.summary }}</p>
        </a>
    </div>
</div>
